<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NFC 사용법 음성 안내</title>

<style>
@font-face {
    font-family: 'MaruBuri';
    src: url('./MaruBuri-Regular.otf') format('opentype');
}
    
body {
    margin: 0;

    min-height: 100dvh;

    background-color: white;

    display: flex;
    flex-direction: column;

    font-family: 'MaruBuri', sans-serif;
}

/* 가운데 가로 3/5 영역 */
#center-box {
    margin-top: 10vh;

    width: 100vw;
    height: 60vh;

    background-color: #25308F;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;

    box-sizing: border-box;
    padding: 40px 20px;
}

/* 메인 문구 */
#message {
    color: white;

    font-size: 2.5rem;
    font-weight: bold;

    text-align: center;
    line-height: 1.4;
}

/* 우측 하단 텍스트 */
#footer {
    margin-top: auto;

    padding-right: 30px;
    padding-bottom: 30px;
    padding-top: 20px;

    color: #25308F;

    font-size: 1.6rem;
    font-weight: bold;

    text-align: right;
    line-height: 1.4;
}

    /* 모바일 대응 */
@media (max-width: 768px) {

    #message {
        font-size: 1.8rem;
    }

    #footer {
        font-size: 1rem;

        padding-right: 20px;
        padding-bottom: 20px;
    }
}

</style>
</head>

<body>

<div id="center-box" onclick="toggleAudio()">

    <div id="message">
        화면을 터치하여<br>
        사용법 음성 안내 듣기
    </div>

</div>

<div id="footer">
    서울여자대학교<br>
    바롬종합설계프로젝트
</div>

<audio id="audio">
    <source src="swu_voice_guide.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("audio");
const message = document.getElementById("message");

function toggleAudio() {

    if (audio.paused) {

        audio.play();

        message.innerHTML =
            "음성 안내 재생 중<br>다시 터치 시, 종료";

    } else {

        audio.pause();
        audio.currentTime = 0;

        message.innerHTML =
            "화면을 터치하여<br>사용법 음성 안내 듣기";
    }
}
</script>

</body>
</html>
