<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NFC 사용법 음성 안내</title>

<style>
body {
    margin: 0;
    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background-color: #87CEEB;
    color: white;

    font-size: 3rem;
    font-weight: bold;
    text-align: center;

    cursor: pointer;
}

#message {
    padding: 20px;
}
</style>
</head>

<body onclick="toggleAudio()">

<div id="message">
    화면을 터치하여<br>
    사용법 음성 안내 듣기
</div>

<audio id="audio">
    <source src="swu_voice_guide.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("audio");
const message = document.getElementById("message");

function toggleAudio() {

    if (audio.paused) {

        audio.play();

        message.innerHTML =
            "음성 안내가 재생 중입니다<br><br>다시 터치하면 종료됩니다";

    } else {

        audio.pause();
        audio.currentTime = 0;

        message.innerHTML =
            "화면을 터치하여<br>사용법 음성 안내 듣기";
    }
}
</script>

</body>
</html>
